name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SRC_IMAGE: websocket-lite-src:latest

jobs:
  cargo-build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build deps
      uses: docker/build-push-action@v6
      with:
        context: .
        target: deps
        cache-from: type=gha,scope=deps
        cache-to: type=gha,mode=max,scope=deps
    - name: cargo build
      uses: docker/build-push-action@v6
      with:
        context: .
        target: src
        tags: ${{ env.SRC_IMAGE }}
        cache-from: type=gha,scope=src
        cache-to: type=gha,mode=max,scope=src

  cargo:
    name: cargo
    runs-on: ubuntu-latest
    needs: cargo-build
    strategy:
      fail-fast: false
      matrix:
        command:
          - cargo check --all-targets
          - cargo clippy --all-targets
          - cargo test
        features:
          - ""
          - --no-default-features
          - --no-default-features --features ssl-rustls-native-roots
          - --no-default-features --features ssl-rustls-webpki-roots
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: cargo build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: src
          tags: ${{ env.SRC_IMAGE }}
          load: true
          cache-from: type=gha,scope=src
      - name: ${{ matrix.command }} ${{ matrix.features }}
        run: >-
          docker run
          ${{ env.SRC_IMAGE }}
          ${{ matrix.command }} ${{ matrix.features }}

  cargo-fmt:
    name: cargo fmt -- --check
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: cargo build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: src
          tags: ${{ env.SRC_IMAGE }}
          load: true
          cache-from: type=gha,scope=src
      - name: cargo fmt -- --check
        run: >-
          docker run
          ${{ env.SRC_IMAGE }}
          cargo fmt -- --check

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build integration test
      uses: docker/build-push-action@v6
      with:
        context: .
        target: app
        tags: 1tgr/websocket-lite:latest
        load: true
        cache-from: type=gha,scope=src
    - name: Integration test
      run: docker compose up --exit-code-from test

  fuzz-test:
    name: Fuzz test
    runs-on: ubuntu-latest
    needs: cargo-build
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build fuzz test
      uses: docker/build-push-action@v6
      with:
        context: .
        target: fuzz
        tags: websocket-lite-fuzz:latest
        load: true
        cache-from: type=gha,scope=src
    - name: Fuzz test
      run: >-
        docker run
        --cap-add SYS_PTRACE
        websocket-lite-fuzz:latest
        cargo fuzz run fuzz_codec fuzz/corpus/custom -- -dict=fuzz/dict.txt -max_total_time=60
